    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.21",
    "pytz>=2025.2",
    "starlette>=0.50.0",
    "toml>=0.10.2",
    "uvicorn>=0.40.0",
    "websockets>=16.0",
]
